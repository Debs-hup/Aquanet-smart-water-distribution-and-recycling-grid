{% extends "auth_base.html" %}
{% block body %}
<style>
  .auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #f8f9fa 0%, #f1f3f4 100%);
    padding: 2rem;
  }
  .auth-card {
    background: white;
    padding: 2.5rem;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
    border: 1px solid #dadce0;
  }
  .auth-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .auth-logo { font-size: 2.5rem; margin-bottom: 1rem; }
  .auth-title { font-size: 1.75rem; color: #202124; margin-bottom: 0.5rem; }
  .auth-subtitle { color: #5f35a9; font-size: 0.95rem; }
  .auth-form { display: flex; flex-direction: column; gap: 1.5rem; }
  .form-group label { font-weight: 600; color: #5f35a9; margin-bottom: 0.5rem; }
  .form-group input { padding: 0.75rem 1rem; border: 1px solid #dadce0; border-radius: 8px; font-size: 1rem; transition: all 0.2s; }
  .form-group input:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1); }
  .submit-button { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s; }
  .submit-button:hover { box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); transform: translateY(-1px); }
  .auth-footer { text-align: center; margin-top: 1.5rem; color: #666; font-size: 0.95rem; }
  .auth-footer a { color: #5f35a9; text-decoration: none; font-weight: 600; }
  .auth-footer a:hover { text-decoration: underline; }
</style>
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🌐</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your AquaNet account</p>
    </div>
    
    <form method="post" class="auth-form">
      <div class="form-group">
        <label for="email">📧 Email Address</label>
        <input name="email" id="email" type="email" required placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="password">🔐 Password</label>
        <input name="password" id="password" type="password" required placeholder="Enter your password" />
      </div>

      <button type="submit" class="submit-button">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a>
    </div>
  </div>
</div>
{% endblock %}
